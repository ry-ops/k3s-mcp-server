<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">K3s MCP tools, and who decides what they can do</title>
  <desc id="d">Eleven tools look (pods, deployments, services, nodes, namespaces, cluster info, logs, events, pod details, resource usage) and five change things (scale, restart, exec, apply, delete). The server has no read-only switch: the RBAC of the kubeconfig it uses decides. With a view role, get_pods is allowed and delete_resource is refused with 403 Forbidden. With an edit role on one namespace, both are allowed there.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e6ebf5; }
    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes rv { 0%,0.00% { opacity: 0; } 2.50%,47.50% { opacity: 1; } 50.00%,100% { opacity: 0; } } .rv { animation: rv 12.0s infinite; }
    @keyframes re { 0%,50.00% { opacity: 0; } 52.50%,97.50% { opacity: 1; } 100.00%,100% { opacity: 0; } } .re { animation: re 12.0s infinite; }
    @keyframes a1 { 0%,5.00% { transform: translateX(0); opacity: 0; } 5.83% { opacity: 1; } 16.67% { transform: translateX(250px); opacity: 1; } 20.83%,100% { transform: translateX(250px); opacity: 0; } } .a1 { animation: a1 12.0s infinite; }
    @keyframes a2 { 0%,21.67% { transform: translateX(0); opacity: 0; } 22.50% { opacity: 1; } 33.33%,48.33% { transform: translateX(142px); opacity: 1; } 50.00%,100% { transform: translateX(142px); opacity: 0; } } .a2 { animation: a2 12.0s infinite; }
    @keyframes b1 { 0%,55.00% { transform: translateX(0); opacity: 0; } 55.83% { opacity: 1; } 66.67% { transform: translateX(250px); opacity: 1; } 70.83%,100% { transform: translateX(250px); opacity: 0; } } .b1 { animation: b1 12.0s infinite; }
    @keyframes b2 { 0%,71.67% { transform: translateX(0); opacity: 0; } 72.50% { opacity: 1; } 83.33% { transform: translateX(250px); opacity: 1; } 87.50%,100% { transform: translateX(250px); opacity: 0; } } .b2 { animation: b2 12.0s infinite; }
    @keyframes x2 { 0%,34.17% { opacity: 0; } 36.67%,46.67% { opacity: 1; } 49.17%,100% { opacity: 0; } } .x2 { animation: x2 12.0s infinite; }
    @keyframes ok1 { 0%,16.67% { opacity: 0; } 19.17%,46.67% { opacity: 1; } 49.17%,100% { opacity: 0; } } .ok1 { animation: ok1 12.0s infinite; }
    @keyframes ok3 { 0%,66.67% { opacity: 0; } 69.17%,96.67% { opacity: 1; } 99.17%,100% { opacity: 0; } } .ok3 { animation: ok3 12.0s infinite; }
    @keyframes ok4 { 0%,83.33% { opacity: 0; } 85.83%,96.67% { opacity: 1; } 99.17%,100% { opacity: 0; } } .ok4 { animation: ok4 12.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .re,.ok3,.ok4 { opacity: 0; } }
  </style>
  <rect width="960" height="470" rx="20" fill="#0f1420"/>
  <text x="30" y="52" font-size="28" font-weight="800">16 tools · your RBAC decides</text>
  <text x="30" y="78" font-size="15" class="muted">There's no read-only switch: the kubeconfig you give it sets the limits.</text>

  <rect x="30" y="98" width="290" height="202" rx="12" fill="#3ddc84" fill-opacity=".08" stroke="#3ddc84" stroke-opacity=".5"/>
  <text x="48" y="124" font-size="14" font-weight="700">Look</text><text x="302" y="125" text-anchor="end" font-size="16" font-weight="800" style="fill:#3ddc84">11</text>
  <text x="48" y="150" font-size="12" class="mono" style="fill:#9ff0c4">get_pods</text><text x="48" y="174" font-size="12" class="mono" style="fill:#9ff0c4">get_deployments</text><text x="48" y="198" font-size="12" class="mono" style="fill:#9ff0c4">get_deployment</text><text x="48" y="222" font-size="12" class="mono" style="fill:#9ff0c4">get_services</text><text x="48" y="246" font-size="12" class="mono" style="fill:#9ff0c4">get_nodes</text><text x="48" y="270" font-size="12" class="mono" style="fill:#9ff0c4">get_namespaces</text><text x="178" y="150" font-size="12" class="mono" style="fill:#9ff0c4">get_cluster_info</text><text x="178" y="174" font-size="12" class="mono" style="fill:#9ff0c4">get_logs</text><text x="178" y="198" font-size="12" class="mono" style="fill:#9ff0c4">get_events</text><text x="178" y="222" font-size="12" class="mono" style="fill:#9ff0c4">describe_pod</text><text x="178" y="246" font-size="12" class="mono" style="fill:#9ff0c4">get_resource_usage</text>
  <rect x="30" y="310" width="290" height="140" rx="12" fill="#ffb02e" fill-opacity=".08" stroke="#ffb02e" stroke-opacity=".5"/>
  <text x="48" y="336" font-size="14" font-weight="700">Change</text><text x="302" y="337" text-anchor="end" font-size="16" font-weight="800" style="fill:#ffb02e">5</text>
  <text x="48" y="362" font-size="12" class="mono" style="fill:#ffd88a">scale_deployment</text><text x="48" y="382" font-size="12" class="mono" style="fill:#ffd88a">restart_pod</text><text x="48" y="402" font-size="12" class="mono" style="fill:#ffd88a">execute_command</text><text x="48" y="422" font-size="12" class="mono" style="fill:#ffd88a">apply_manifest</text><text x="48" y="442" font-size="12" class="mono" style="fill:#ffd88a">delete_resource</text>

  <!-- RBAC demo -->
  <text x="350" y="124" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">KUBECONFIG IDENTITY</text>
  <g class="rv"><rect x="350" y="136" width="250" height="40" rx="10" fill="#10283a" stroke="#3ec7ff"/><text x="366" y="161" font-size="13"><tspan font-weight="700">ClusterRole</tspan> <tspan class="mono" style="fill:#a8e4ff">view</tspan> <tspan class="muted">· read anywhere</tspan></text></g>
  <g class="re"><rect x="350" y="136" width="250" height="40" rx="10" fill="#2d2512" stroke="#ffb02e"/><text x="366" y="161" font-size="13"><tspan font-weight="700">Role</tspan> <tspan class="mono" style="fill:#ffd88a">edit</tspan> <tspan class="muted">· namespace shop</tspan></text></g>

  <line x1="420" y1="226" x2="800" y2="226" stroke="#232c3f" stroke-width="2"/>
  <line x1="420" y1="296" x2="800" y2="296" stroke="#232c3f" stroke-width="2"/>
  <rect x="700" y="200" width="8" height="122" rx="4" fill="#8b96ad" opacity=".5"/>
  <text x="704" y="342" text-anchor="middle" font-size="10" font-weight="700" class="muted">RBAC</text>
  <g class="a1"><rect x="420" y="214" width="132" height="24" rx="12" fill="#3ddc84"/><text x="486" y="230" text-anchor="middle" font-size="11" font-weight="800" class="mono" style="fill:#0f1420">get_pods</text></g><g class="a2"><rect x="420" y="284" width="132" height="24" rx="12" fill="#ffb02e"/><text x="486" y="300" text-anchor="middle" font-size="11" font-weight="800" class="mono" style="fill:#0f1420">delete_resource</text></g>
  <g class="b1"><rect x="420" y="214" width="132" height="24" rx="12" fill="#3ddc84"/><text x="486" y="230" text-anchor="middle" font-size="11" font-weight="800" class="mono" style="fill:#0f1420">get_pods</text></g><g class="b2"><rect x="420" y="284" width="132" height="24" rx="12" fill="#ffb02e"/><text x="486" y="300" text-anchor="middle" font-size="11" font-weight="800" class="mono" style="fill:#0f1420">delete_resource</text></g>
  <rect x="808" y="190" width="122" height="140" rx="14" fill="#161d2b" stroke="#ffc61c" stroke-width="2"/>
  <text x="869" y="252" text-anchor="middle" font-size="13" font-weight="800">K3s API</text>
  <text x="869" y="270" text-anchor="middle" font-size="10.5" class="muted">server</text>
  <g class="ok1"><text x="869" y="214" text-anchor="middle" font-size="12" font-weight="700" style="fill:#9ff0c4">200 OK</text></g>
  <g class="x2"><text x="610" y="282" text-anchor="middle" font-size="12" font-weight="800" style="fill:#ff9aa5">403 Forbidden</text></g>
  <g class="ok3"><text x="869" y="214" text-anchor="middle" font-size="12" font-weight="700" style="fill:#9ff0c4">200 OK</text></g>
  <g class="ok4"><text x="869" y="316" text-anchor="middle" font-size="12" font-weight="700" style="fill:#9ff0c4">deleted</text></g>

  <rect x="350" y="370" width="580" height="70" rx="12" fill="#161d2b" stroke="#2c3750"/>
  <text x="366" y="396" font-size="13"><tspan font-weight="700">Just watching?</tspan> Use a kubeconfig bound to <tspan class="mono" style="fill:#a8e4ff">view</tspan>.</text>
  <text x="366" y="420" font-size="13"><tspan font-weight="700">Hands-on?</tspan> Scope <tspan class="mono" style="fill:#ffd88a">edit</tspan> to the namespaces you trust it with.</text>
</svg>
