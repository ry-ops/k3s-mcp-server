<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="t d">
  <title id="t">K3s MCP tools, and who decides what they can do</title>
  <desc id="d">Twenty-one tools look (pods, deployments, statefulsets, daemonsets, jobs, cronjobs, services, ingresses, configmaps, volume claims, nodes, namespaces, cluster info, any resource, logs, events, pod details, resource usage, rollout status and history) and nine change things (scale, restart, exec, apply, delete, rollout restart and undo, cordon and uncordon). The server has no read-only switch: the RBAC of the kubeconfig it uses decides. With a view role, get_pods is allowed and delete_resource is refused with 403 Forbidden. With an edit role on one namespace, both are allowed there.</desc>
  <style>
