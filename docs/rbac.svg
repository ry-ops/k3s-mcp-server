  <text x="704" y="342" text-anchor="middle" font-size="10" font-weight="700" class="muted">RBAC</text>
  <g class="a1"><rect x="420" y="214" width="132" height="24" rx="12" fill="#3ddc84"/><text x="486" y="230" text-anchor="middle" font-size="11" font-weight="800" class="mono" style="fill:#0f1420">get_pods</text></g><g class="a2"><rect x="420" y="284" width="132" height="24" rx="12" fill="#ffb02e"/><text x="486" y="300" text-anchor="middle" font-size="11" font-weight="800" class="mono" style="fill:#0f1420">delete_resource</text></g>
  <g class="b1"><rect x="420" y="214" width="132" height="24" rx="12" fill="#3ddc84"/><text x="486" y="230" text-anchor="middle" font-size="11" font-weight="800" class="mono" style="fill:#0f1420">get_pods</text></g><g class="b2"><rect x="420" y="284" width="132" height="24" rx="12" fill="#ffb02e"/><text x="486" y="300" text-anchor="middle" font-size="11" font-weight="800" class="mono" style="fill:#0f1420">delete_resource</text></g>
