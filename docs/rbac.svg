    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes rv { 0%,0.00% { opacity: 0; } 2.50%,47.50% { opacity: 1; } 50.00%,100% { opacity: 0; } } .rv { animation: rv 12.0s infinite; }
    @keyframes re { 0%,50.00% { opacity: 0; } 52.50%,97.50% { opacity: 1; } 100.00%,100% { opacity: 0; } } .re { animation: re 12.0s infinite; }
    @keyframes a1 { 0%,5.00% { transform: translateX(0); opacity: 0; } 5.83% { opacity: 1; } 16.67% { transform: translateX(250px); opacity: 1; } 20.83%,100% { transform: translateX(250px); opacity: 0; } } .a1 { animation: a1 12.0s infinite; }
    @keyframes a2 { 0%,21.67% { transform: translateX(0); opacity: 0; } 22.50% { opacity: 1; } 33.33%,48.33% { transform: translateX(142px); opacity: 1; } 50.00%,100% { transform: translateX(142px); opacity: 0; } } .a2 { animation: a2 12.0s infinite; }
    @keyframes b1 { 0%,55.00% { transform: translateX(0); opacity: 0; } 55.83% { opacity: 1; } 66.67% { transform: translateX(250px); opacity: 1; } 70.83%,100% { transform: translateX(250px); opacity: 0; } } .b1 { animation: b1 12.0s infinite; }
    @keyframes b2 { 0%,71.67% { transform: translateX(0); opacity: 0; } 72.50% { opacity: 1; } 83.33% { transform: translateX(250px); opacity: 1; } 87.50%,100% { transform: translateX(250px); opacity: 0; } } .b2 { animation: b2 12.0s infinite; }
    @keyframes x2 { 0%,34.17% { opacity: 0; } 36.67%,46.67% { opacity: 1; } 49.17%,100% { opacity: 0; } } .x2 { animation: x2 12.0s infinite; }
    @keyframes ok1 { 0%,16.67% { opacity: 0; } 19.17%,46.67% { opacity: 1; } 49.17%,100% { opacity: 0; } } .ok1 { animation: ok1 12.0s infinite; }
    @keyframes ok3 { 0%,66.67% { opacity: 0; } 69.17%,96.67% { opacity: 1; } 99.17%,100% { opacity: 0; } } .ok3 { animation: ok3 12.0s infinite; }
    @keyframes ok4 { 0%,83.33% { opacity: 0; } 85.83%,96.67% { opacity: 1; } 99.17%,100% { opacity: 0; } } .ok4 { animation: ok4 12.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .re,.ok3,.ok4 { opacity: 0; } }
  </style>
  <rect width="960" height="490" rx="20" fill="#0f1420"/>
  <text x="30" y="52" font-size="28" font-weight="800">30 cluster tools · your RBAC decides</text>
  <text x="30" y="78" font-size="15" class="muted">There's no read-only switch: the kubeconfig you give it sets the limits.</text>

  <rect x="30" y="98" width="290" height="222" rx="12" fill="#3ddc84" fill-opacity=".08" stroke="#3ddc84" stroke-opacity=".5"/>
  <text x="48" y="124" font-size="14" font-weight="700">Look</text><text x="302" y="125" text-anchor="end" font-size="16" font-weight="800" style="fill:#3ddc84">21</text>
  <text x="48" y="146" font-size="12" class="mono" style="fill:#9ff0c4">get_pods</text><text x="48" y="162" font-size="12" class="mono" style="fill:#9ff0c4">get_deployments</text><text x="48" y="178" font-size="12" class="mono" style="fill:#9ff0c4">get_deployment</text><text x="48" y="194" font-size="12" class="mono" style="fill:#9ff0c4">get_statefulsets</text><text x="48" y="210" font-size="12" class="mono" style="fill:#9ff0c4">get_daemonsets</text><text x="48" y="226" font-size="12" class="mono" style="fill:#9ff0c4">get_jobs</text><text x="48" y="242" font-size="12" class="mono" style="fill:#9ff0c4">get_cronjobs</text><text x="48" y="258" font-size="12" class="mono" style="fill:#9ff0c4">get_services</text><text x="48" y="274" font-size="12" class="mono" style="fill:#9ff0c4">get_ingresses</text><text x="48" y="290" font-size="12" class="mono" style="fill:#9ff0c4">get_configmaps</text><text x="48" y="306" font-size="12" class="mono" style="fill:#9ff0c4">get_pvcs</text><text x="178" y="146" font-size="12" class="mono" style="fill:#9ff0c4">get_nodes</text><text x="178" y="162" font-size="12" class="mono" style="fill:#9ff0c4">get_namespaces</text><text x="178" y="178" font-size="12" class="mono" style="fill:#9ff0c4">get_cluster_info</text><text x="178" y="194" font-size="12" class="mono" style="fill:#9ff0c4">get_resource</text><text x="178" y="210" font-size="12" class="mono" style="fill:#9ff0c4">get_logs</text><text x="178" y="226" font-size="12" class="mono" style="fill:#9ff0c4">get_events</text><text x="178" y="242" font-size="12" class="mono" style="fill:#9ff0c4">describe_pod</text><text x="178" y="258" font-size="12" class="mono" style="fill:#9ff0c4">get_resource_usage</text><text x="178" y="274" font-size="12" class="mono" style="fill:#9ff0c4">rollout_status</text><text x="178" y="290" font-size="12" class="mono" style="fill:#9ff0c4">rollout_history</text>
  <rect x="30" y="330" width="290" height="140" rx="12" fill="#ffb02e" fill-opacity=".08" stroke="#ffb02e" stroke-opacity=".5"/>
  <text x="48" y="356" font-size="14" font-weight="700">Change</text><text x="302" y="357" text-anchor="end" font-size="16" font-weight="800" style="fill:#ffb02e">9</text>
  <text x="48" y="382" font-size="12" class="mono" style="fill:#ffd88a">scale_deployment</text><text x="48" y="401" font-size="12" class="mono" style="fill:#ffd88a">restart_pod</text><text x="48" y="420" font-size="12" class="mono" style="fill:#ffd88a">execute_command</text><text x="48" y="439" font-size="12" class="mono" style="fill:#ffd88a">apply_manifest</text><text x="48" y="458" font-size="12" class="mono" style="fill:#ffd88a">delete_resource</text><text x="178" y="382" font-size="12" class="mono" style="fill:#ffd88a">rollout_restart</text><text x="178" y="401" font-size="12" class="mono" style="fill:#ffd88a">rollout_undo</text><text x="178" y="420" font-size="12" class="mono" style="fill:#ffd88a">cordon_node</text><text x="178" y="439" font-size="12" class="mono" style="fill:#ffd88a">uncordon_node</text>

  <!-- RBAC demo -->
  <text x="350" y="124" font-size="11" font-weight="700" class="muted" letter-spacing=".1em">KUBECONFIG IDENTITY</text>
  <g class="rv"><rect x="350" y="136" width="250" height="40" rx="10" fill="#10283a" stroke="#3ec7ff"/><text x="366" y="161" font-size="13"><tspan font-weight="700">ClusterRole</tspan> <tspan class="mono" style="fill:#a8e4ff">view</tspan> <tspan class="muted">· read anywhere</tspan></text></g>
  <g class="re"><rect x="350" y="136" width="250" height="40" rx="10" fill="#2d2512" stroke="#ffb02e"/><text x="366" y="161" font-size="13"><tspan font-weight="700">Role</tspan> <tspan class="mono" style="fill:#ffd88a">edit</tspan> <tspan class="muted">· namespace shop</tspan></text></g>

  <line x1="420" y1="226" x2="800" y2="226" stroke="#232c3f" stroke-width="2"/>
  <line x1="420" y1="296" x2="800" y2="296" stroke="#232c3f" stroke-width="2"/>
