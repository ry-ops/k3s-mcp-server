  <rect x="350" y="370" width="580" height="70" rx="12" fill="#161d2b" stroke="#2c3750"/>
  <text x="366" y="396" font-size="13"><tspan font-weight="700">Just watching?</tspan> Use a kubeconfig bound to <tspan class="mono" style="fill:#a8e4ff">view</tspan>.</text>
  <text x="366" y="420" font-size="13"><tspan font-weight="700">Hands-on?</tspan> Scope <tspan class="mono" style="fill:#ffd88a">edit</tspan> to the namespaces you trust it with.</text>
